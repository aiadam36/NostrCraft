name: Build and release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Build mod
        run: |
          ./gradlew --no-daemon setupDecompWorkspace build

      - name: Prepare release asset
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mkdir -p dist

          JAR_PATH="$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name 'NostrCraft-1.12.2-*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -print -quit)"

          if [ -z "$JAR_PATH" ]; then
            echo "::error::NostrCraft JAR was not generated."
            ls -lah build/libs
            exit 1
          fi

          cp "$JAR_PATH" "dist/NostrCraft-1.12.2-${TAG_NAME}.jar"

          ls -lah dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
