name: Notifications

on:
  workflow_run:
    workflows: ["Build and release"]
    types: [completed]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Publish notification
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          if [ "$CONCLUSION" = "success" ]; then
            TOPIC="main"
            TITLE="NostrCraft: release succeeded"
            PRIORITY="3"
            TAGS="rocket"
          elif [ "$CONCLUSION" = "failure" ]; then
            TOPIC="alerts"
            TITLE="NostrCraft: release failed"
            PRIORITY="4"
            TAGS="warning"
          else
            exit 0
          fi

          curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: $TITLE" \
            -H "Priority: $PRIORITY" \
            -H "Tags: $TAGS" \
            -d "This notification was automatically generated by GitHub Actions" \
            "https://ntfy.adamiskandar.com/$TOPIC"
